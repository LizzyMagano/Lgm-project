<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern Window Simulator</title>

  <script>
    // Protect page
    if (localStorage.getItem('loggedIn') !== 'true') {
      window.location.href = 'index.html';
    }
  </script>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#000;
      color:#fff;
      display:flex;
      justify-content:center;
      min-height:100vh;
    }

    .app{
      width:100%;
      max-width:430px;
      padding:20px;
    }

    .topbar{
      display:flex;
      justify-content:flex-end;
      margin-bottom:10px;
    }

    .logout{
      background:#ff4444;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    h1{
      text-align:center;
      font-size:28px;
      margin-bottom:6px;
    }

    .sub{
      text-align:center;
      color:#bdbdbd;
      margin-bottom:22px;
      font-size:14px;
    }

    .inputs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:16px;
    }

    input{
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:18px;
      text-align:center;
      background:#f5f5f5;
      color:#111;
    }

    button.generate{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#fff;
      color:#000;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-bottom:20px;
    }

    button.generate:hover{
      background:#e9e9e9;
    }

    .pattern{
      text-align:center;
      margin-bottom:18px;
      font-size:18px;
    }

    .pattern span{
      color:#00ff88;
      font-weight:bold;
    }

    .alert{
      display:none;
      background:#2a1200;
      border:1px solid #ff8c00;
      color:#ffcc80;
      padding:12px;
      border-radius:12px;
      margin-bottom:18px;
      text-align:center;
      font-size:14px;
      line-height:1.4;
    }

    .card{
      background:#101010;
      border:1px solid #222;
      border-radius:16px;
      padding:16px;
      margin-bottom:16px;
    }

    .title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:6px;
    }

    .range{
      font-size:28px;
      font-weight:bold;
      color:#00ff88;
      margin-bottom:6px;
    }

    .time{
      color:#ff4db8;
      margin-bottom:10px;
      font-size:15px;
    }

    .meta{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:13px;
      color:#d0d0d0;
      flex-wrap:wrap;
    }

    .high{ color:#00ff88; }
    .med{ color:#ffd166; }
    .low{ color:#ff6b6b; }

    .footer{
      margin-top:20px;
      text-align:center;
      color:#777;
      font-size:12px;
      line-height:1.5;
    }
  </style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <h1>📊 Pattern Window Simulator</h1>
  <div class="sub">Realistic trend watch tool • 2-minute windows • volatility aware</div>

  <div class="inputs">
    <input type="time" step="1" id="signalTime" value="06:20:07">
    <input type="number" step="0.01" id="signalValue" value="5.5" placeholder="Multiplier">
  </div>

  <button class="generate" onclick="generate()">Generate Windows</button>

  <div id="alert" class="alert"></div>
  <div id="results"></div>

  <div class="footer">
    Observation tool only. High volatility does not guarantee a high multiplier.
    50x+ is treated as a rare possibility, not an expectation.
  </div>

</div>

<script>
function logout(){
  localStorage.removeItem('loggedIn');
  window.location.href = 'login.html';
}

function parseTime(str){
  const [h,m,s] = str.split(':').map(Number);
  return new Date(2000,0,1,h,m,s);
}

function formatTime(d){
  return d.toTimeString().slice(0,8);
}

function addMinutes(d,min){
  return new Date(d.getTime() + min*60000);
}

function detectPattern(x){
  if(x >= 50) return 'EXTREME';
  if(x >= 20) return 'HIGH';
  if(x >= 10) return 'STRONG';
  if(x >= 5) return 'MEDIUM';
  return 'LOW';
}

function getWindowRanges(base){
  if(base >= 50){
    return [
      '3x–12x',
      '5x–18x',
      '6x–20x',
      '8x–25x',
      '10x–35x (50x+ possible)'
    ];
  }

  if(base >= 20){
    return [
      '3x–10x',
      '5x–15x',
      '6x–18x',
      '8x–25x',
      '10x–40x (50x+ possible)'
    ];
  }

  if(base >= 10){
    return [
      '3x–8x',
      '4x–12x',
      '5x–15x',
      '6x–20x',
      '8x–30x'
    ];
  }

  if(base >= 5){
    return [
      '2.5x–6x',
      '3x–8x',
      '3.5x–10x',
      '4x–12x',
      '5x–15x'
    ];
  }

  return [
    '1.5x–4x',
    '2x–5x',
    '2.5x–6x',
    '3x–8x',
    '4x–10x'
  ];
}

function volatility(base,index){
  let score;

  if(base >= 50) score = 82 + index*2;
  else if(base >= 20) score = 76 + index*2;
  else if(base >= 10) score = 70 + index*2;
  else if(base >= 5) score = 64 + index*2;
  else score = 52 + index*2;

  score = Math.min(96, score);

  let label = 'Moderate';
  let cls = 'low';

  if(score >= 80){
    label = 'High';
    cls = 'high';
  } else if(score >= 60){
    label = 'Medium-High';
    cls = 'med';
  }

  return {score,label,cls};
}

function probability(base,index){
  let p;

  if(base >= 50) p = 44 - index*3;
  else if(base >= 20) p = 56 - index*3;
  else if(base >= 10) p = 62 - index*3;
  else if(base >= 5) p = 58 - index*3;
  else p = 50 - index*3;

  return Math.max(22, p);
}

function generate(){
  const t = document.getElementById('signalTime').value;
  const x = parseFloat(document.getElementById('signalValue').value);

  if(!t || isNaN(x)){
    alert('Enter a valid time and multiplier');
    return;
  }

  const baseTime = parseTime(t);
  const pattern = detectPattern(x);
  const ranges = getWindowRanges(x);

  const alertBox = document.getElementById('alert');

  if(x >= 20){
    alertBox.style.display = 'block';
    alertBox.innerHTML =
      '⚠️ Strong signal detected. Rare 50x+ scenarios may appear in later windows, but they are treated as low-frequency events.';
  } else {
    alertBox.style.display = 'none';
  }

  let html = `
    <div class="pattern">Detected Pattern: <span>${pattern}</span></div>
  `;

  for(let i=1;i<=5;i++){
    const start = addMinutes(baseTime, i*2);
    const end = addMinutes(start, 2);
    const v = volatility(x,i);
    const p = probability(x,i);

    html += `
      <div class="card">
        <div class="title">Window ${i}</div>
        <div class="range">${ranges[i-1]}</div>
        <div class="time">${formatTime(start)} – ${formatTime(end)} (±2 min)</div>
        <div class="meta">
          <span class="${v.cls}">Volatility: ${v.label} (${v.score}/100)</span>
          <span>Observation Score: ${p}%</span>
        </div>
      </div>
    `;
  }

  document.getElementById('results').innerHTML = html;
}

generate();
</script>

</body>
</html>
