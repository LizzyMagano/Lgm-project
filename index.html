<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Pattern Simulator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      width: 90%;
      max-width: 360px;
      background: #111;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background: #222;
      color: #fff;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00ff88;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00e67a;
    }

    .error {
      margin-top: 14px;
      color: #ff6b6b;
      font-size: 14px;
      display: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 Login</h1>
    <p>Enter your credentials to open the calculator</p>

    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />

    <button onclick="login()">Login</button>

    <div id="error" class="error">Invalid username or password</div>

    <div class="footer">
      Pattern Window Simulator
    </div>
  </div>

  <script>
    // Change these credentials to your own
    const USERNAME = "lizzy";
    const PASSWORD = "gl2025";

    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === USERNAME && pass === PASSWORD) {
        // Save login state
        localStorage.setItem('loggedIn', 'true');

        // Open calculator page
        window.location.href = 'calculator.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }

    // If already logged in, skip login page
    if (localStorage.getItem('loggedIn') === 'true') {
      window.location.href = 'calculator.html';
    }
  </script>
</body>
</html>
